<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CASS People directory</title>
<link rel="stylesheet" href="km-nav.css">
<style>
/* People directory: who owns a service page, who is the expert, and who to ask for new content. Profile pop-up with email links. Tokens copied from index.html. */
:root{
  --bg:#eef3fa;--surface:#ffffff;--surface-2:#e8f0fb;--ink:#0f2342;--muted:#55657f;--line:#d9e3f1;
  --brand:#1a5dc8;--brand-soft:#e3edfb;--on-brand:#ffffff;--hdr1:#0b1f3a;--hdr1b:#163360;--hdr2:#1a5dc8;--hdr3:#1f62cc;--hdr-ink:#ffffff;--hdr-muted:#e3edfb;
  --ok:#1d7f55;--ok-bg:#e3f4ec;
  --partial:#efcf6a;--partial-ink:#7a6210;--partial-bg:#fbf3d6;
  --warn:#9a6411;--warn-bg:#fbf0dc;--none:#7a8896;--none-bg:#edf1f4;--bad:#b42318;--bad-bg:#fdeceb;
  --new:#c2410c;--new-bg:#fdeee5;--lock:#7c3aed;--lock-bg:#f1eafe;--hl:#fff6d6;--hl-line:#e3c35a;--mark:#fdeeb0;
  --t1:#be185d;--t2:#0e7490;--t3:#8a4b14;--t4:#374151;--t-ink:#ffffff;
  --overlay:rgba(5,20,35,.5);--toast-bg:#0f2342;--toast-ink:#ffffff;
  --shadow:0 2px 12px rgba(11,31,58,.09);--panel-line:#dde6f3;--pop-shadow:0 12px 32px rgba(11,31,58,.18);
  --font:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#09172b;--surface:#0f2440;--surface-2:#163153;--ink:#e4edfa;--muted:#9db3d0;--line:#26436b;
  --brand:#5ba4f5;--brand-soft:#17335c;--on-brand:#06203d;--hdr-muted:#c3d8f5;
  --ok:#5bd09a;--ok-bg:#163a2b;--partial:#e3c45f;--partial-ink:#efd78c;--partial-bg:#3a3218;
  --warn:#e7b25a;--warn-bg:#3a2d14;--none:#8e9dab;--none-bg:#1e3142;--bad:#f59a8f;--bad-bg:#3d1a17;
  --new:#fb9a5c;--new-bg:#3f2414;--lock:#c4a5ff;--lock-bg:#2c2147;--hl:#2f2a14;--hl-line:#b89a3c;--mark:#5a4a12;
  --t1:#f472b6;--t2:#22d3ee;--t3:#e0a35e;--t4:#cbd5e1;--t-ink:#09172b;
  --overlay:rgba(0,0,0,.6);--toast-bg:#e4edfa;--toast-ink:#09172b;
  --shadow:0 4px 16px rgba(0,0,0,.3);--panel-line:#26436b;--pop-shadow:0 12px 32px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09172b;--surface:#0f2440;--surface-2:#163153;--ink:#e4edfa;--muted:#9db3d0;--line:#26436b;
  --brand:#5ba4f5;--brand-soft:#17335c;--on-brand:#06203d;--hdr-muted:#c3d8f5;
  --ok:#5bd09a;--ok-bg:#163a2b;--partial:#e3c45f;--partial-ink:#efd78c;--partial-bg:#3a3218;
  --warn:#e7b25a;--warn-bg:#3a2d14;--none:#8e9dab;--none-bg:#1e3142;--bad:#f59a8f;--bad-bg:#3d1a17;
  --new:#fb9a5c;--new-bg:#3f2414;--lock:#c4a5ff;--lock-bg:#2c2147;--hl:#2f2a14;--hl-line:#b89a3c;--mark:#5a4a12;
  --t1:#f472b6;--t2:#22d3ee;--t3:#e0a35e;--t4:#cbd5e1;--t-ink:#09172b;
  --overlay:rgba(0,0,0,.6);--toast-bg:#e4edfa;--toast-ink:#09172b;
  --shadow:0 4px 16px rgba(0,0,0,.3);--panel-line:#26436b;--pop-shadow:0 12px 32px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html{overflow-x:hidden}
body{margin:0;font-family:var(--font);font-size:14px;color:var(--ink);background:var(--bg);line-height:1.45;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.top :focus-visible,.hero :focus-visible{outline-color:#ffffff}
.wrap{padding-inline:max(16px,4vw)}
.top{background:linear-gradient(105deg,var(--hdr1),var(--hdr1b));color:var(--hdr-ink);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:12px}
.brand{color:var(--hdr-ink)}
.brand{display:inline-flex;align-items:center}.brand img{display:block;height:46px;width:auto}@media (max-width:560px){.brand img{height:36px}}
.mock{font-size:12px;background:var(--hl);color:var(--ink);border-bottom:1px solid var(--hl-line);padding-block:6px}
.hero{background:linear-gradient(110deg,var(--hdr1),var(--hdr2) 62%,var(--hdr3));color:var(--hdr-ink);padding-block:26px}
.eyebrow{margin:0 0 4px;font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--brand)}
.hero .eyebrow{color:#a9c8f5}
.hero h1{margin:0 0 4px;font-size:26px;text-wrap:balance}
.hero p{margin:0 0 14px;color:var(--hdr-muted);max-width:65ch}
.hero .search{display:flex;max-width:560px;background:var(--surface);border-radius:12px;overflow:hidden}
.hero .search input{flex:1;min-width:0;border:0;padding:12px 14px;background:transparent;font-size:14.5px}
.hero .search input:focus-visible{outline:none}
.page{padding-block:22px;display:grid;gap:16px}
.panel{background:var(--surface);border:1px solid var(--panel-line,var(--line));border-radius:16px;box-shadow:var(--shadow);min-width:0}
.pad{padding:20px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:650;font-size:13px;padding:7px 14px;border-radius:999px;cursor:pointer}
.chip:hover{border-color:var(--brand)}.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.meta{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.pcard{display:grid;gap:10px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--panel-line,var(--line));border-radius:16px;box-shadow:var(--shadow);padding:16px;cursor:pointer}
.pcard:hover{border-color:var(--brand)}
.pcard .top1{display:flex;gap:12px;align-items:center}
.av{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;background:var(--hdr1)}
.av.big{width:62px;height:62px;font-size:20px}
.pcard b{display:block;font-size:15px}.pcard small{color:var(--muted);font-size:12.5px}
.roles{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.p-own,.p-exp,.p-req{background:var(--brand-soft);color:var(--brand)}
.empty{padding:26px;color:var(--muted);text-align:center}
.pf-bg{position:fixed;inset:0;z-index:300;background:var(--overlay);display:grid;place-items:center;padding:16px}
.pf{position:relative;background:var(--surface);color:var(--ink);border-radius:22px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:26px 28px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.pf::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:linear-gradient(90deg,var(--hdr1),var(--hdr2),#5ba4f5)}
.pf-x{position:absolute;right:12px;top:14px;border:0;background:var(--surface-2);color:var(--muted);width:32px;height:32px;border-radius:50%;font-size:20px;line-height:1;cursor:pointer}
.pf-h{display:flex;gap:16px;align-items:center;margin:6px 36px 14px 0}.pf-h h2{margin:0;font-size:21px}.pf-h .role{color:var(--muted)}
.pf h3{margin:16px 0 6px;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.pf dl{display:grid;grid-template-columns:90px 1fr;gap:6px 12px;margin:0}.pf dt{color:var(--muted)}.pf dd{margin:0;overflow-wrap:anywhere}
.pf ul{margin:0;padding-left:18px;display:grid;gap:4px}.pf li a{color:var(--brand);font-weight:600}.pf li a:hover{text-decoration:underline}
.pf .about{color:var(--muted);margin:12px 0 0}
.mail{font-weight:700;color:var(--brand);overflow-wrap:anywhere}.mail:hover{text-decoration:underline}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:650;font-size:13.5px;padding:9px 16px;border-radius:10px;cursor:pointer}
.btn:hover{border-color:var(--brand)}.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}.btn.primary:hover{filter:brightness(1.08)}
.reqbox{background:var(--brand-soft);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 6px}
.reqbox b{display:block}.reqbox .acts{margin-top:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:560px){.pf{padding:22px 18px}.pf dl{grid-template-columns:1fr}.pf dt{margin-top:6px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top wrap"><a class="brand" href="index.html" aria-label="CASS Knowledge Centre home"><img src="cass-logo.png" alt=""></a></header>
<div class="tabbar wrap"><nav class="nav" aria-label="Main"><a href="index.html">Knowledge Centre</a><a href="glossary.html">Glossary</a><a href="new-joiner-academy.html">New Joiner Academy</a><a class="on" href="people.html" aria-current="page">People directory</a></nav><span class="sp"></span><a class="adm" href="admin.html">Admin<span class="lg"> login</span></a></div>
<div class="mock wrap" id="mockBanner" hidden></div>
<section class="hero wrap"><p class="eyebrow">Who to ask</p><h1>People directory</h1><p>Page owners, experts and the people to ask for new content, with their contact details.</p>
  <form class="search" role="search" onsubmit="return false"><label for="pq" class="sr">Search people</label><input id="pq" type="search" placeholder="Search by name, role or service, e.g. Credit or 3.1.1" autocomplete="off"></form></section>
<main class="page wrap" id="page">
  <div class="chips" id="chips" role="group" aria-label="Filter by tower"></div>
  <div class="meta" id="count" aria-live="polite"></div>
  <div class="grid" id="grid"></div>
</main>
<div id="profileRoot"></div>
<script src="km-data.js"></script>
<script src="km-boot.js"></script>
<script>
(function(){
const D=window.KM;if(!D)return;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const PEOPLE=(D.people||[]).filter(p=>p&&p.id),TN=D.towerNames||{},CONTACTS=(D.settings&&D.settings.requestContacts)||{};
const initials=n=>String(n||'').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase();
const L2={},L1={};(D.taxonomy||[]).forEach(t=>(t.l1||[]).forEach(a=>{L1[a.code]={name:a.name,tower:t.name,code:a.code};(a.l2||[]).forEach(b=>{L2[b.code]={name:b.name,l1:a.code,tower:t.name}})}));
const pages=D.l2Pages||{};
const owns=id=>Object.keys(pages).filter(c=>pages[c]&&pages[c].owner===id&&L2[c]).sort(cmp),exps=id=>Object.keys(pages).filter(c=>pages[c]&&pages[c].expert===id&&L2[c]).sort(cmp),reqs=id=>Object.keys(CONTACTS).filter(c=>CONTACTS[c]===id&&L1[c]).sort(cmp);
function cmp(a,b){return a.localeCompare(b,'en',{numeric:true})}
const towerOf=p=>/^[1-4]$/.test(p.tower||'')?p.tower:'';
const first=p=>String(p.name||'').split(/\s+/)[0];
const baseUrl=()=>location.href.replace(/[?#].*$/,'').replace(/[^/]*$/,'');
let tower='all',q='';
/* ---- list ---- */
const hasOther=PEOPLE.some(p=>!towerOf(p));
function chips(){const list=[['all','All towers'],...Object.keys(TN).map(k=>[k,TN[k]])];if(hasOther)list.push(['0','Other teams']);
  $('chips').innerHTML=list.map(([k,n])=>`<button type="button" class="chip" data-t="${esc(k)}" aria-pressed="${tower===k}">${esc(n)}</button>`).join('')}
function matches(p){
  if(tower!=='all'&&(tower==='0'?towerOf(p):towerOf(p)!==tower))return false;
  if(!q)return true;const h=[p.name,p.role,p.team,...owns(p.id).map(c=>c+' '+L2[c].name),...exps(p.id).map(c=>c+' '+L2[c].name),...reqs(p.id).map(c=>c+' '+L1[c].name)].join(' ').toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(t=>h.includes(t))}
function card(p){const t=towerOf(p),o=owns(p.id).length,e=exps(p.id).length,r=reqs(p.id).length;
  return `<button type="button" class="pcard" data-id="${esc(p.id)}" aria-haspopup="dialog"><span class="top1"><span class="av" aria-hidden="true">${esc(initials(p.name))}</span><span><b>${esc(p.name)}</b><small>${esc(p.role)}</small></span></span>
   <small>${esc(p.team||'')}</small>
   <span class="roles">${o?`<span class="pill p-own">Page owner · ${o}</span>`:''}${e?`<span class="pill p-exp">Ask the expert · ${e}</span>`:''}${r?`<span class="pill p-req">Content requests</span>`:''}</span></button>`}
function render(){chips();const list=PEOPLE.filter(matches).sort((a,b)=>a.name.localeCompare(b.name,'en'));
  $('count').textContent=list.length===PEOPLE.length?`${PEOPLE.length} people`:`${list.length} of ${PEOPLE.length} people`;
  $('grid').innerHTML=list.length?list.map(card).join(''):'<div class="empty panel">No one matches. Try another word or choose “All towers”.</div>'}
/* ---- profile ---- */
function mailParts(p,code){
  const n=L2[code];if(!n)return null;
  const subject=`Content request: ${code} ${n.name}`;
  const body=`Hello ${first(p)},\n\nPlease add knowledge content (SOPs, guides, videos) for this service in the CASS Knowledge Centre:\n${code} ${n.name} (${n.tower} › ${L1[n.l1].name})\nPage: ${baseUrl()}index.html#l2-${code}\n\nThank you.`;
  return {subject,body}}
const enc=encodeURIComponent;
const mailto=(p,m)=>'mailto:'+(p.email||'')+(m?`?subject=${enc(m.subject)}&body=${enc(m.body)}`:'');
let opener=null,reqCode='';
function closeProfile(){const r=$('profileRoot');if(!r.firstChild)return;r.innerHTML='';document.documentElement.style.overflow='';reqCode='';
  try{history.replaceState(null,'',location.pathname)}catch(e){}if(opener&&document.contains(opener))try{opener.focus()}catch(e){}opener=null}
function openProfile(id,code){const p=PEOPLE.find(x=>x.id===id);if(!p)return false;
  const t=towerOf(p),o=owns(id),e=exps(id),m=code&&L2[code]?mailParts(p,code):null;reqCode=m?code:'';const r=m?reqs(id).filter(c=>c===L2[code].l1):reqs(id);
  const link=c=>`<li><a href="index.html#l2-${esc(c)}">${esc(c)} ${esc(L2[c].name)}</a></li>`;
  $('profileRoot').innerHTML=`<div class="pf-bg" data-bg><div class="pf" role="dialog" aria-modal="true" aria-labelledby="pfName"><button type="button" class="pf-x" aria-label="Close" data-x>×</button>
   <div class="pf-h"><span class="av big" aria-hidden="true">${esc(initials(p.name))}</span><div><h2 id="pfName">${esc(p.name)}</h2><div class="role">${esc(p.role)}</div></div></div>
   ${m?`<div class="reqbox"><b>Request content for ${esc(reqCode)} ${esc(L2[reqCode].name)}</b><div class="acts"><a class="btn primary" id="pfReq" href="${esc(mailto(p,m))}">Email</a></div></div>`:''}
   <h3>Contact</h3><dl><dt>Email</dt><dd>${p.email?`<a class="mail" id="pfMail" href="${esc(mailto(p))}">${esc(p.email)}</a>`:'<span class="meta">Not added yet</span>'}</dd>${p.phone?`<dt>Phone</dt><dd>${esc(p.phone)}</dd>`:''}${p.location?`<dt>Office</dt><dd>${esc(p.location)}</dd>`:''}${p.hours?`<dt>Hours</dt><dd>${esc(p.hours)}</dd>`:''}<dt>Team</dt><dd>${esc(p.team||'')}</dd></dl>
   ${p.email&&!m?`<div class="acts"><a class="btn primary" href="${esc(mailto(p))}">Email</a><a class="btn" href="https://teams.microsoft.com/l/chat/0/0?users=${enc(p.email)}" target="_blank" rel="noopener noreferrer">Chat in Teams</a></div>`:''}
   ${p.about?`<p class="about">${esc(p.about)}</p>`:''}
   ${r.length?`<h3>Receives content requests for</h3><ul>${r.map(c=>`<li>${esc(c)} ${esc(L1[c].name)} <span class="meta">(${esc(L1[c].tower)})</span></li>`).join('')}</ul>`:''}
   ${o.length?`<h3>Page owner of</h3><ul>${o.map(link).join('')}</ul>`:''}${e.length?`<h3>Ask the expert for</h3><ul>${e.map(link).join('')}</ul>`:''}</div></div>`;
  document.documentElement.style.overflow='hidden';
  const root=$('profileRoot'),dlg=root.querySelector('.pf'),x=root.querySelector('.pf-x'),firstFocus=root.querySelector('#pfReq')||root.querySelector('#pfMail')||x;firstFocus.focus();
  root.querySelector('.pf-bg').addEventListener('click',ev=>{if(ev.target.dataset.bg!==undefined||ev.target===x)closeProfile()});
  root.addEventListener('keydown',ev=>{if(ev.key==='Escape'){ev.preventDefault();ev.stopPropagation();closeProfile()}else if(ev.key==='Tab'){const f=[...dlg.querySelectorAll('a[href],button')].filter(el=>!el.disabled);if(!f.length)return;const i=f.indexOf(document.activeElement);ev.preventDefault();f[(i+(ev.shiftKey?-1:1)+f.length)%f.length].focus()}});
  return true}
/* ---- events ---- */
$('chips').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;tower=b.dataset.t;render()});
$('pq').addEventListener('input',e=>{q=e.target.value.trim();render()});
$('grid').addEventListener('click',e=>{const c=e.target.closest('.pcard');if(!c)return;opener=c;openProfile(c.dataset.id);try{history.replaceState(null,'','#person-'+c.dataset.id)}catch(x){}});
function fromUrl(){const m=location.hash.match(/^#person-(.+)$/);if(!m)return;let id=m[1];try{id=decodeURIComponent(id)}catch(e){}
  let code='';try{code=new URLSearchParams(location.search).get('request')||''}catch(e){}openProfile(id,code)}
render();fromUrl();
addEventListener('hashchange',()=>{if(!location.hash)closeProfile();else fromUrl()});
window.kmGuide&&window.kmGuide('people');
})();
</script>
</body>
</html>
