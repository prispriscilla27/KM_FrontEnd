<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CASS Document</title>
<style>
/* Document viewer for a Knowledge Centre item: details, then the embedded viewer (PDF, image, text/CSV, video, audio). Nothing downloads automatically. Tokens copied from index.html. */
:root{
  --bg:#f3f6fa;--surface:#ffffff;--surface-2:#eef4f9;--ink:#16324a;--muted:#5d7385;--line:#dae4ed;
  --brand:#0a6fc2;--brand-soft:#e5f1fb;--on-brand:#ffffff;--hdr1:#052944;--hdr1b:#07527e;--hdr2:#0b6899;--hdr3:#15a9c8;--hdr-ink:#ffffff;--hdr-muted:#d4ebf5;
  --ok:#1d7f55;--ok-bg:#e3f4ec;
  --partial:#efcf6a;--partial-ink:#7a6210;--partial-bg:#fbf3d6;
  --warn:#9a6411;--warn-bg:#fbf0dc;--none:#7a8896;--none-bg:#edf1f4;--bad:#b42318;--bad-bg:#fdeceb;
  --new:#c2410c;--new-bg:#fdeee5;--lock:#7c3aed;--lock-bg:#f1eafe;--hl:#fff6d6;--hl-line:#e3c35a;--mark:#fdeeb0;
  --t1:#be185d;--t2:#0e7490;--t3:#8a4b14;--t4:#374151;--t-ink:#ffffff;
  --overlay:rgba(5,20,35,.5);--toast-bg:#16324a;--toast-ink:#ffffff;
  --shadow:0 4px 16px rgba(18,59,90,.07);--pop-shadow:0 12px 32px rgba(10,40,70,.18);
  --font:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1824;--surface:#122536;--surface-2:#173046;--ink:#e2ecf4;--muted:#9bb0c1;--line:#244059;
  --brand:#4ea9f2;--brand-soft:#173a57;--on-brand:#06223a;--hdr-muted:#c3dfee;
  --ok:#5bd09a;--ok-bg:#163a2b;--partial:#e3c45f;--partial-ink:#efd78c;--partial-bg:#3a3218;
  --warn:#e7b25a;--warn-bg:#3a2d14;--none:#8e9dab;--none-bg:#1e3142;--bad:#f59a8f;--bad-bg:#3d1a17;
  --new:#fb9a5c;--new-bg:#3f2414;--lock:#c4a5ff;--lock-bg:#2c2147;--hl:#2f2a14;--hl-line:#b89a3c;--mark:#5a4a12;
  --t1:#f472b6;--t2:#22d3ee;--t3:#e0a35e;--t4:#cbd5e1;--t-ink:#0c1824;
  --overlay:rgba(0,0,0,.6);--toast-bg:#e2ecf4;--toast-ink:#0c1824;
  --shadow:0 4px 16px rgba(0,0,0,.3);--pop-shadow:0 12px 32px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1824;--surface:#122536;--surface-2:#173046;--ink:#e2ecf4;--muted:#9bb0c1;--line:#244059;
  --brand:#4ea9f2;--brand-soft:#173a57;--on-brand:#06223a;--hdr-muted:#c3dfee;
  --ok:#5bd09a;--ok-bg:#163a2b;--partial:#e3c45f;--partial-ink:#efd78c;--partial-bg:#3a3218;
  --warn:#e7b25a;--warn-bg:#3a2d14;--none:#8e9dab;--none-bg:#1e3142;--bad:#f59a8f;--bad-bg:#3d1a17;
  --new:#fb9a5c;--new-bg:#3f2414;--lock:#c4a5ff;--lock-bg:#2c2147;--hl:#2f2a14;--hl-line:#b89a3c;--mark:#5a4a12;
  --t1:#f472b6;--t2:#22d3ee;--t3:#e0a35e;--t4:#cbd5e1;--t-ink:#0c1824;
  --overlay:rgba(0,0,0,.6);--toast-bg:#e2ecf4;--toast-ink:#0c1824;
  --shadow:0 4px 16px rgba(0,0,0,.3);--pop-shadow:0 12px 32px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html{overflow-x:hidden}
body{margin:0;font-family:var(--font);font-size:14px;color:var(--ink);background:var(--bg);line-height:1.45;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h2[tabindex="-1"]:focus,.result[tabindex="-1"]:focus{outline:none}
.top :focus-visible,.hero :focus-visible,.final :focus-visible{outline-color:#ffffff}
.wrap{padding-inline:max(16px,4vw)}
.top{background:linear-gradient(105deg,var(--hdr1),var(--hdr1b));color:var(--hdr-ink);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:12px}
.brand{font-weight:800;font-size:19px;letter-spacing:.4px;color:var(--hdr-ink)}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a{padding:8px 12px;border-radius:8px;color:var(--hdr-ink)}
.nav a:hover,.nav .on{background:rgba(255,255,255,.14)}
.mock{font-size:12px;background:var(--hl);color:var(--ink);border-bottom:1px solid var(--hl-line);padding-block:6px}
.hero{background:linear-gradient(110deg,var(--hdr1),var(--hdr2) 62%,var(--hdr3));color:var(--hdr-ink);padding-block:26px}
.hero h1{margin:0 0 4px;font-size:26px;text-wrap:balance;overflow-wrap:anywhere}
.hero p{margin:0;color:var(--hdr-muted);max-width:65ch}
.page{padding-block:22px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:0}
.pad{padding:20px}
h2{margin:0 0 6px;font-size:20px;text-wrap:balance;overflow-wrap:anywhere}
.sub{color:var(--muted);margin:0;max-width:70ch}
.note{font-size:12px;color:var(--muted);margin:8px 0 0}
.crumb{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.crumb a{color:var(--brand)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;vertical-align:middle}
.tw-1{--tc:var(--t1)}.tw-2{--tc:var(--t2)}.tw-3{--tc:var(--t3)}.tw-4{--tc:var(--t4)}
.pill.tw{background:var(--tc);color:var(--t-ink)}
.tag{display:inline-block;background:var(--surface-2);color:var(--ink);padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;margin:0 4px 2px 0}
.tag.type{background:var(--brand-soft);color:var(--brand)}
.tag.tba{background:var(--warn-bg);color:var(--warn)}
.tag.okt{background:var(--ok-bg);color:var(--ok)}
.btn{display:inline-flex;align-items:center;justify-content:center;text-align:center;background:var(--brand);color:var(--on-brand);border:1px solid var(--brand);padding:9px 15px;border-radius:9px;font-weight:700;cursor:pointer;font-size:13.5px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--surface);color:var(--brand);border-color:var(--line)}
.btn.ghost:hover{background:var(--brand-soft);filter:none}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn:disabled,.btn[aria-disabled="true"]{background:var(--surface-2);color:var(--muted);border-color:var(--line);cursor:not-allowed;filter:none}
.tlink{border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12px;padding:2px 4px}
.tlink:disabled{cursor:not-allowed;opacity:.6;text-decoration:none}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--toast-bg);color:var(--toast-ink);padding:10px 16px;border-radius:9px;z-index:50;font-size:13px;max-width:calc(100% - 32px);box-shadow:var(--pop-shadow)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.health{border-left:4px solid var(--new)}
.banner-admin{background:var(--hl);border:1px solid var(--hl-line);border-radius:10px;padding:9px 12px;font-size:13px}
.footnav{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
/* progress circle */
.ring{flex:none;display:block}
.ring .rt{fill:none;stroke:var(--line);stroke-width:6}
.ring .rb{fill:none;stroke:var(--brand);stroke-width:6;stroke-linecap:round}
.ring.done .rt,.ring.done .rb{stroke:var(--ok)}
.ring text{fill:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;font-family:var(--font)}
.ring .ck{fill:none;stroke:var(--ok);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:no-preference){.ring .rb{transition:stroke-dasharray .5s ease}}
.dmeta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 18px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:13px}
.dmeta>div{min-width:0;overflow-wrap:anywhere}
.dmeta b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:3px}
.p-approved{background:var(--ok-bg);color:var(--ok)}.p-draft{background:var(--warn-bg);color:var(--warn)}.p-review{background:var(--brand-soft);color:var(--brand)}.p-role{background:var(--surface-2);color:var(--ink);font-weight:600}.p-lock{background:var(--lock-bg);color:var(--lock)}
.person{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px 3px 3px;cursor:pointer;font-size:13px;max-width:100%}
.person:hover{border-color:var(--brand);color:var(--brand)}
.person .av{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:800;background:var(--brand-soft);color:var(--brand)}
.viewer{display:grid;gap:10px}
.viewer iframe,.viewer object{width:100%;height:min(82vh,1100px);min-height:420px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.viewer img{max-width:100%;height:auto;border-radius:10px;border:1px solid var(--line);justify-self:start}
.viewer video{width:100%;max-height:75vh;border-radius:10px;background:#000}
.viewer audio{width:100%}
.viewer pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:13px;max-height:75vh;overflow:auto}
.csvwrap{overflow:auto;max-height:75vh;border:1px solid var(--line);border-radius:10px}
.csvwrap table{border-collapse:collapse;font-size:13px;width:100%}
.csvwrap th,.csvwrap td{border-bottom:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top;white-space:nowrap}
.csvwrap th{position:sticky;top:0;background:var(--surface-2)}
.lockbox{background:var(--lock-bg);color:var(--ink);border-radius:10px;padding:12px 14px;font-size:13.5px}
.lockbox b{color:var(--lock)}
.pop{position:fixed;z-index:40;width:min(320px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--pop-shadow);padding:16px;display:grid;gap:10px}
.pop h4{margin:0;font-size:15.5px}
.pop dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;font-size:13px}
.pop dt{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.pop dd{margin:0;overflow-wrap:anywhere}
.pop .close{position:absolute;top:8px;right:8px;border:0;background:none;cursor:pointer;color:var(--muted);font-size:18px;padding:4px 8px;border-radius:6px}
.acts2{display:flex;gap:8px;flex-wrap:wrap}
.kmviews{display:inline-flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<header class="top wrap"><a class="brand" href="index.html" aria-label="CASS Knowledge Centre home">CASS</a><nav class="nav" aria-label="Main"><a class="on" href="index.html">Knowledge Centre</a><a href="new-joiner-academy.html">New Joiner Academy</a><a href="admin.html">Admin login</a></nav></header>
<div class="mock wrap" id="mockBanner" hidden></div>
<main class="page wrap" id="page"></main>
<div id="popRoot"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="km-data.js"></script>
<script src="km-boot.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id),D=window.KM,page=$('page');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(!D||!Array.isArray(D.items)){page.innerHTML='<section class="panel pad health" role="alert"><h2>Content not available</h2><p class="sub">The content file km-data.js could not be loaded. Make sure it sits in the same folder as this page.</p></section>';return}
(function(){const bn=D.settings&&D.settings.banner,mb=$('mockBanner');if(bn&&bn.on&&String(bn.text||'').trim()){mb.textContent=bn.text;mb.hidden=false}else mb.remove()})();
function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>{t.hidden=true},2600)}
const PEOPLE={};(D.people||[]).forEach(p=>PEOPLE[p.id]=p);
const L2={};(D.taxonomy||[]).forEach(a=>a.l1.forEach(b=>b.l2.forEach(x=>L2[x.code]={name:x.name,l0:a,l1:b})));
const ST={'Approved':'p-approved','Draft':'p-draft','In review':'p-review'};
const fmt=d=>{if(!d)return '';const x=new Date(String(d).slice(0,10)+'T00:00:00');return isNaN(x)?esc(d):x.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})};
const initials=n=>String(n).split(/\s+/).filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const extOf=n=>{const m=/\.([a-z0-9]+)$/i.exec(String(n||''));return m?m[1].toLowerCase():''};
const OFFICE=['doc','docx','dot','dotx','docm','ppt','pptx','pps','ppsx','pptm','xls','xlsx','xlsm','xlsb','odt','odp','ods','rtf'];
/* only relative paths inside documents/ are used, never a URL typed into the data */
const safePath=p=>{p=String(p||'');return /^documents\/[A-Za-z0-9._\-\/]+$/.test(p)&&!p.includes('..')?p:''};
/* person pop-up (same content as in the Knowledge Centre) */
let anchor=null;
function closePop(f){$('popRoot').innerHTML='';if(f&&anchor)anchor.focus();anchor=null}
function openPop(p,a){closePop();anchor=a;const teams='https://teams.microsoft.com/l/chat/0/0?users='+encodeURIComponent(p.email||'');
  $('popRoot').innerHTML=`<div class="pop" role="dialog" aria-labelledby="pn"><button type="button" class="close" data-pc aria-label="Close">×</button><h4 id="pn">${esc(p.name)}</h4><div class="sub" style="font-size:12.5px">${esc(p.role)}</div><dl><dt>Team</dt><dd>${esc(p.team)}</dd><dt>Email</dt><dd>${esc(p.email)}</dd><dt>Phone</dt><dd>${esc(p.phone)}</dd><dt>Office</dt><dd>${esc(p.location)}</dd><dt>Hours</dt><dd>${esc(p.hours)}</dd></dl><div class="acts2"><button type="button" class="btn sm" data-copy="${esc(p.email)}">Copy email</button><a class="btn ghost sm" href="${esc(teams)}" target="_blank" rel="noopener noreferrer">Chat in Teams</a></div></div>`;
  const pop=$('popRoot').firstElementChild,r=a.getBoundingClientRect(),vw=document.documentElement.clientWidth,vh=innerHeight;let top=r.bottom+8;if(top+pop.offsetHeight>vh-12)top=Math.max(12,r.top-pop.offsetHeight-8);pop.style.left=Math.min(Math.max(12,r.left),vw-pop.offsetWidth-12)+'px';pop.style.top=top+'px';pop.querySelector('[data-copy]').focus()}
document.addEventListener('click',e=>{const pc=e.target.closest('[data-person]');if(pc){const p=PEOPLE[pc.dataset.person];if(anchor===pc)return closePop(true);if(p)openPop(p,pc);return}
  if(e.target.closest('[data-pc]'))return closePop(true);
  const cp=e.target.closest('[data-copy]');if(cp){const v=cp.dataset.copy;(navigator.clipboard&&window.isSecureContext?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('Email copied'),()=>toast('Copy this email: '+v));return}
  if($('popRoot').firstChild&&!e.target.closest('.pop'))closePop(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('popRoot').firstChild)closePop(true)});
let id='';try{id=new URLSearchParams(location.search).get('item')||''}catch(e){}
const it=(D.items||[]).find(i=>i.id===id);
if(!it){document.title='Document not found · CASS';page.innerHTML=`<div class="crumb"><a href="index.html">Home</a> › Knowledge Centre › Document</div><section class="panel pad"><h2>We could not find this document</h2><p class="sub">The link may be old, or the item was removed or renamed. Search for it in the Knowledge Centre.</p><div class="actions"><a class="btn" href="index.html">Back to Knowledge Centre</a></div></section>`;return}
const svc=L2[it.l2],owner=PEOPLE[it.owner];
if(window.kmCountView)window.kmCountView(it.id);   /* same entry, same day = one view, whether opened from the panel or this page */
document.title=it.title+' · CASS Knowledge Centre';
const chip=p=>p?`<button type="button" class="person" data-person="${esc(p.id)}" aria-haspopup="dialog"><span class="av" aria-hidden="true">${esc(initials(p.name))}</span><span>${esc(p.name)}</span></button>`:'<span class="muted"><i>To be assigned</i></span>';
const back=svc?`index.html#l2-${encodeURIComponent(it.l2)}`:'index.html';
const head=`<div class="crumb"><a href="index.html">Home</a> › Knowledge Centre › ${svc?`<a href="${back}">${esc(it.l2+' '+svc.name)}</a>`:esc(it.l2)} › Document</div>
 <section class="panel pad"><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px"><span class="pill p-role">${esc(it.type)}</span>${ST[it.status]?`<span class="pill ${ST[it.status]}">${esc(it.status)}</span>`:''}${it.requireAccess?'<span class="pill p-lock">Require access</span>':''}</div>
 <h2>${esc(it.title)}</h2>${it.description?`<p class="sub">${esc(it.description)}</p>`:''}
 <div class="dmeta"><div><b>Version</b>${esc(it.version||'')}</div><div><b>Last updated</b>${fmt(it.updated)}</div><div><b>Views</b>${window.kmEye?window.kmEye(it.id):''}</div><div><b>Owner</b>${chip(owner)}</div><div><b>Service</b>${esc(it.l2)} ${esc(svc?svc.name:'')}</div></div></section>`;
const foot=`<div class="footnav"><a class="btn ghost" href="${back}">Back to Knowledge Centre</a></div>`;
/* Require access items never show a viewer or a download, even if the data holds a document. */
if(it.requireAccess){
  const link=/^https:\/\//i.test(it.link||'')?it.link:'';
  page.innerHTML=head+`<section class="panel pad"><div class="lockbox"><b>Require access.</b> This file holds customer or bank details, so it is only open to people with permission. Ask the owner for access.</div><div class="acts2" style="margin-top:12px">${owner?chip(owner):''}${link?`<a class="btn" href="${esc(link)}" target="_blank" rel="noopener noreferrer">Request access in Microsoft Loop</a>`:''}</div></section>`+foot;
  return;
}
const d=it.document;
if(!d||!safePath(d.file)){page.innerHTML=head+`<section class="panel pad"><h3 style="margin:0 0 6px">No document uploaded</h3><p class="sub">This item has no document to show here.${/^https:\/\//i.test(it.link||'')?' It may be in Microsoft Loop:':''}</p>${/^https:\/\//i.test(it.link||'')?`<div class="actions"><a class="btn" href="${esc(it.link)}" target="_blank" rel="noopener noreferrer">Open in Microsoft Loop</a></div>`:''}</section>`+foot;return}
page.innerHTML=head+`<section class="panel pad viewer" aria-labelledby="vH"><h3 id="vH" style="margin:0">${esc(d.name||'Document')}</h3><div id="viewer"><p class="sub">Loading the document…</p></div><div class="acts2" id="dl"></div></section>`+foot;

/* In admin preview the draft's files come from this browser's IndexedDB; readers get the published files in documents/. */
function idbGet(key){return new Promise(res=>{let r;try{r=indexedDB.open('cassKM',1)}catch(e){return res(null)}r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('files'))db.createObjectStore('files');if(!db.objectStoreNames.contains('handles'))db.createObjectStore('handles')};r.onerror=()=>res(null);r.onsuccess=()=>{try{const q=r.result.transaction('files').objectStore('files').get(key);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)}catch(e){res(null)}}})}
async function source(path){if(!path)return null;if(window.KM_PREVIEW){const rec=await idbGet(path);if(rec&&rec.blob)return {url:URL.createObjectURL(rec.blob),blob:rec.blob}}return {url:path,blob:null}}
function loadText(path,blob){if(blob)return blob.text();return new Promise((res,rej)=>{window.KM_DOC_TEXT=null;const s=document.createElement('script');s.src=path+'.view.js';s.onload=()=>{const t=window.KM_DOC_TEXT;t&&t.file===path?res(t.text):rej(new Error('mismatch'))};s.onerror=()=>rej(new Error('missing'));document.head.appendChild(s)})}
function csvRows(t){const rows=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){r.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);f='';rows.push(r);r=[]}else f+=c}if(f||r.length){r.push(f);rows.push(r)}return rows.filter(x=>x.some(y=>y!==''))}
(async function(){
  const v=$('viewer'),ext=extOf(d.name),type=d.type||'',main=await source(safePath(d.file));
  const pdf=(ext==='pdf'||type==='application/pdf')?main:(OFFICE.includes(ext)&&safePath(d.viewFile)?await source(safePath(d.viewFile)):null);
  if(d.allowDownload!==false&&main)$('dl').innerHTML=`<a class="btn ghost" href="${esc(main.url)}" download="${esc(d.name||'')}">Download${OFFICE.includes(ext)?' the '+esc(ext.toUpperCase())+' file':''}</a>`;
  if(pdf){v.innerHTML=`<iframe src="${esc(pdf.url)}#view=FitH" title="${esc(d.name||'PDF document')}"></iframe><p class="note">If the document does not appear above, this browser cannot show PDFs inside the page.${d.allowDownload!==false?' Use Download to open it.':' Ask the owner for a copy.'}</p>`;return}
  if(OFFICE.includes(ext)){v.innerHTML=`<p class="sub"><b>Preview is not available for this file type.</b> ${esc(ext.toUpperCase())} files cannot be shown inside a web page.${d.allowDownload!==false?' Use Download to open it in Office.':' Ask the owner for a copy.'}</p>`;return}
  if(/^image\//.test(type)||['png','jpg','jpeg','gif','webp','bmp'].includes(ext)){v.innerHTML=`<img src="${esc(main.url)}" alt="${esc(it.title)}">`;return}
  if(/^video\//.test(type)||['mp4','webm','mov','m4v','ogv'].includes(ext)){v.innerHTML=`<video controls preload="metadata" src="${esc(main.url)}"></video>`;return}
  if(/^audio\//.test(type)||['mp3','wav','ogg','m4a','aac'].includes(ext)){v.innerHTML=`<audio controls preload="metadata" src="${esc(main.url)}"></audio>`;return}
  if(['txt','csv','tsv','md','log'].includes(ext)||/^text\//.test(type)){
    try{const t=await loadText(safePath(d.file),main.blob);
      if(ext==='csv'||ext==='tsv'){const rows=t.includes('\t')&&ext==='tsv'?t.split(/\r?\n/).filter(Boolean).map(l=>l.split('\t')):csvRows(t);v.innerHTML=rows.length?`<div class="csvwrap"><table><thead><tr>${rows[0].map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.slice(1,2001).map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${rows.length>2001?'<p class="note">Showing the first 2,000 rows.</p>':''}`:'<p class="sub">The file is empty.</p>'}
      else v.innerHTML=`<pre>${esc(t)}</pre>`}
    catch(e){v.innerHTML=`<p class="sub">The text of this file could not be shown here.${d.allowDownload!==false?' Use Download to open it.':''}</p>`}
    return}
  v.innerHTML=`<p class="sub"><b>Preview is not available for this file type.</b>${d.allowDownload!==false?' Use Download to open it.':' Ask the owner for a copy.'}</p>`;
})();


})();
</script>
</body>
</html>
