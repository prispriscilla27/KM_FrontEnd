<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CASS Glossary</title>
<link rel="stylesheet" href="km-nav.css">
<style>
/* Glossary: every acronym and term on one page, with a tower filter, search and A to Z jump. Tokens copied from index.html. */
:root{
  --bg:#eef3fa;--surface:#ffffff;--surface-2:#e8f0fb;--ink:#0f2342;--muted:#55657f;--line:#d9e3f1;
  --brand:#1a5dc8;--brand-soft:#e3edfb;--on-brand:#ffffff;--hdr1:#0b1f3a;--hdr1b:#163360;--hdr2:#1a5dc8;--hdr3:#1f62cc;--hdr-ink:#ffffff;--hdr-muted:#e3edfb;
  --ok:#1d7f55;--ok-bg:#e3f4ec;
  --partial:#efcf6a;--partial-ink:#7a6210;--partial-bg:#fbf3d6;
  --warn:#9a6411;--warn-bg:#fbf0dc;--none:#7a8896;--none-bg:#edf1f4;--bad:#b42318;--bad-bg:#fdeceb;
  --new:#c2410c;--new-bg:#fdeee5;--lock:#7c3aed;--lock-bg:#f1eafe;--hl:#fff6d6;--hl-line:#e3c35a;--mark:#fdeeb0;
  --t1:#be185d;--t2:#0e7490;--t3:#8a4b14;--t4:#374151;--t-ink:#ffffff;
  --overlay:rgba(5,20,35,.5);--toast-bg:#0f2342;--toast-ink:#ffffff;
  --shadow:0 2px 12px rgba(11,31,58,.09);--panel-line:#dde6f3;--pop-shadow:0 12px 32px rgba(11,31,58,.18);
  --font:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#09172b;--surface:#0f2440;--surface-2:#163153;--ink:#e4edfa;--muted:#9db3d0;--line:#26436b;
  --brand:#5ba4f5;--brand-soft:#17335c;--on-brand:#06203d;--hdr-muted:#c3d8f5;
  --ok:#5bd09a;--ok-bg:#163a2b;--partial:#e3c45f;--partial-ink:#efd78c;--partial-bg:#3a3218;
  --warn:#e7b25a;--warn-bg:#3a2d14;--none:#8e9dab;--none-bg:#1e3142;--bad:#f59a8f;--bad-bg:#3d1a17;
  --new:#fb9a5c;--new-bg:#3f2414;--lock:#c4a5ff;--lock-bg:#2c2147;--hl:#2f2a14;--hl-line:#b89a3c;--mark:#5a4a12;
  --t1:#f472b6;--t2:#22d3ee;--t3:#e0a35e;--t4:#cbd5e1;--t-ink:#09172b;
  --overlay:rgba(0,0,0,.6);--toast-bg:#e4edfa;--toast-ink:#09172b;
  --shadow:0 4px 16px rgba(0,0,0,.3);--panel-line:#26436b;--pop-shadow:0 12px 32px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09172b;--surface:#0f2440;--surface-2:#163153;--ink:#e4edfa;--muted:#9db3d0;--line:#26436b;
  --brand:#5ba4f5;--brand-soft:#17335c;--on-brand:#06203d;--hdr-muted:#c3d8f5;
  --ok:#5bd09a;--ok-bg:#163a2b;--partial:#e3c45f;--partial-ink:#efd78c;--partial-bg:#3a3218;
  --warn:#e7b25a;--warn-bg:#3a2d14;--none:#8e9dab;--none-bg:#1e3142;--bad:#f59a8f;--bad-bg:#3d1a17;
  --new:#fb9a5c;--new-bg:#3f2414;--lock:#c4a5ff;--lock-bg:#2c2147;--hl:#2f2a14;--hl-line:#b89a3c;--mark:#5a4a12;
  --t1:#f472b6;--t2:#22d3ee;--t3:#e0a35e;--t4:#cbd5e1;--t-ink:#09172b;
  --overlay:rgba(0,0,0,.6);--toast-bg:#e4edfa;--toast-ink:#09172b;
  --shadow:0 4px 16px rgba(0,0,0,.3);--panel-line:#26436b;--pop-shadow:0 12px 32px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html{overflow-x:hidden}
body{margin:0;font-family:var(--font);font-size:14px;color:var(--ink);background:var(--bg);line-height:1.45;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.top :focus-visible,.hero :focus-visible{outline-color:#ffffff}
.wrap{padding-inline:max(16px,4vw)}
.top{background:linear-gradient(105deg,var(--hdr1),var(--hdr1b));color:var(--hdr-ink);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:12px}
.brand{color:var(--hdr-ink)}
.brand{display:inline-flex;align-items:center}.brand img{display:block;height:46px;width:auto}@media (max-width:560px){.brand img{height:36px}}
.mock{font-size:12px;background:var(--hl);color:var(--ink);border-bottom:1px solid var(--hl-line);padding-block:6px}
.hero{background:linear-gradient(110deg,var(--hdr1),var(--hdr2) 62%,var(--hdr3));color:var(--hdr-ink);padding-block:26px}
.eyebrow{margin:0 0 4px;font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--brand)}
.hero .eyebrow{color:#a9c8f5}
.hero h1{margin:0 0 4px;font-size:26px;text-wrap:balance}
.hero p{margin:0 0 14px;color:var(--hdr-muted);max-width:65ch}
.hero .search{display:flex;max-width:560px;background:var(--surface);border-radius:12px;overflow:hidden}
.hero .search input{flex:1;min-width:0;border:0;padding:12px 14px;background:transparent;font-size:14.5px}
.hero .search input:focus-visible{outline:none}

.page{padding-block:22px;display:grid;gap:16px}
.panel{background:var(--surface);border:1px solid var(--panel-line,var(--line));border-radius:16px;box-shadow:var(--shadow);min-width:0}
.pad{padding:20px}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:650;font-size:13px;padding:7px 14px;border-radius:999px;cursor:pointer}
.chip:hover{border-color:var(--brand)}.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.pill{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.tw,.pill.all{background:var(--brand-soft);color:var(--brand)}
.tba{color:var(--muted);font-style:italic}
.note{font-size:12px;color:var(--muted);margin:12px 0 0}
.gl-meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.gl-az{display:flex;flex-wrap:wrap;gap:2px}
.azb{border:0;background:none;color:var(--brand);font-weight:700;cursor:pointer;padding:3px 6px;border-radius:6px;font-size:12px}
.azb:hover{background:var(--brand-soft)}.azb:disabled{color:var(--muted);opacity:.45;cursor:default;background:none}
.gl-list{display:grid;margin-top:6px}
.gl-letter{font-weight:800;font-size:14px;color:var(--brand);padding:14px 0 4px;border-bottom:1px solid var(--line);scroll-margin-top:16px}
.gl-row{display:grid;grid-template-columns:150px minmax(0,1fr) 230px;gap:6px 16px;padding:10px 6px;border-bottom:1px solid var(--line);align-items:start;scroll-margin-top:16px;transition:background-color .4s}
.gl-row.flash{background:var(--brand-soft);border-radius:8px}
.gl-term{font-weight:700;overflow-wrap:anywhere}
.gl-mean{overflow-wrap:anywhere}
.gl-tw{display:flex;gap:4px;flex-wrap:wrap}
.empty{padding:26px;color:var(--muted);text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:700px){.gl-row{grid-template-columns:minmax(0,1fr)}.gl-tw{margin-top:2px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top wrap"><a class="brand" href="index.html" aria-label="CASS Knowledge Centre home"><img src="cass-logo.png" alt=""></a></header>
<div class="tabbar wrap"><nav class="nav" aria-label="Main"><a href="index.html">Knowledge Centre</a><a class="on" href="glossary.html" aria-current="page">Glossary</a><a href="new-joiner-academy.html">New Joiner Academy</a><a href="people.html">People directory</a></nav><span class="sp"></span><a class="adm" href="admin.html">Admin<span class="lg"> login</span></a></div>
<div class="mock wrap" id="mockBanner" hidden></div>
<section class="hero wrap"><p class="eyebrow">Acronyms and terms</p><h1>Glossary</h1><p>Every acronym and term used across CASS, in one place.</p>
  <form class="search" role="search" onsubmit="return false"><label for="gq" class="sr">Search the glossary</label><input id="gq" type="search" placeholder="Search a term or meaning, e.g. LC or guarantee" autocomplete="off"></form></section>
<main class="page wrap" id="page">
  <section class="panel pad">
    <div class="chips" id="glchips" role="group" aria-label="Filter by tower"></div>
    <div class="gl-meta"><span id="glcount" aria-live="polite"></span><span class="gl-az" id="glaz" role="group" aria-label="Jump to letter"></span></div>
    <div class="gl-list" id="gllist"></div>
    <p class="note">Tower tags show where a term is used. “Not assigned yet” means we could not tell, so it stays blank until a tower head confirms it.</p>
  </section>
  <div id="faqBox"></div>
</main>
<script src="km-data.js"></script>
<script src="km-boot.js"></script>
<script>
(function(){
const D=window.KM;if(!D)return;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const norm=s=>String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/&/g,' and ').replace(/[^a-z0-9.\/ ]+/g,' ').replace(/\s+/g,' ').trim();
const slug=s=>String(s).replace(/[^A-Za-z0-9]+/g,'_');
const TN=D.towerNames||{};
const GLOSSARY=(D.glossary||[]).map(g=>({term:String(g.term||''),meaning:String(g.meaning||''),towers:Array.isArray(g.towers)?g.towers.map(String):[]}));
const towerText=g=>g.towers.includes('all')?'All towers':g.towers.map(c=>TN[c]||c).join(', ');
const hl=(text,q)=>{text=String(text==null?'':text);const words=[...new Set(norm(q).split(' ').filter(w=>w.length>=2))].sort((a,b)=>b.length-a.length);if(!words.length)return esc(text);
  const re=new RegExp('('+words.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi');let out='',last=0,m;
  while((m=re.exec(text))){if(!m[0]){re.lastIndex++;continue}out+=esc(text.slice(last,m.index))+'<mark>'+esc(m[0])+'</mark>';last=m.index+m[0].length}return out+esc(text.slice(last))};
let gl={tower:'all',q:''},flashTerm=null;
const letterOf=t=>{const c=(t[0]||'').toUpperCase();return /[A-Z]/.test(c)?c:'#'};
function filtered(){const q=norm(gl.q);
  return GLOSSARY.filter(g=>{
    if(gl.tower==='none'){if(g.towers.length)return false}
    else if(gl.tower!=='all'){if(!(g.towers.includes(gl.tower)||g.towers.includes('all')))return false}
    return !q||norm(g.term+' '+g.meaning+' '+towerText(g)).includes(q);
  }).sort((x,y)=>x.term.localeCompare(y.term,'en',{numeric:true,sensitivity:'base'}))}
const towerChips=g=>!g.towers.length?'<span class="tba">Not assigned yet</span>':g.towers.includes('all')?'<span class="pill all">All towers</span>':g.towers.map(c=>`<span class="pill tw">${esc(TN[c]||c)}</span>`).join(' ');
function renderList(){
  const list=filtered();let cur='',rows='';const letters=[];
  if(!list.length)rows=`<p class="empty">No terms match${gl.q?' “'+esc(gl.q)+'”':''}${gl.tower!=='all'?' for this filter':''}. Try another word or choose “All towers”.</p>`;
  list.forEach(g=>{const L=letterOf(g.term);if(L!==cur){cur=L;letters.push(L);rows+=`<div class="gl-letter" id="gl-${L==='#'?'num':L}">${L}</div>`}
    rows+=`<div class="gl-row ${flashTerm===g.term?'flash':''}" id="gt-${slug(g.term)}"><div class="gl-term">${hl(g.term,gl.q)}</div><div class="gl-mean">${g.meaning?hl(g.meaning,gl.q):'<span class="tba">Meaning to be added</span>'}</div><div class="gl-tw">${towerChips(g)}</div></div>`});
  $('gllist').innerHTML=rows;$('glcount').textContent=list.length+' term'+(list.length===1?'':'s');
  const az='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');if(GLOSSARY.some(g=>letterOf(g.term)==='#'))az.push('#');
  $('glaz').innerHTML=az.map(L=>`<button type="button" class="azb" data-letter="${L}" ${letters.includes(L)?'':'disabled'} aria-label="Terms starting with ${L==='#'?'a number':L}">${L}</button>`).join('');
}
function renderChips(){
  $('glchips').innerHTML=[['all','All towers'],...Object.entries(TN),['none','Not assigned yet']].map(([k,n])=>`<button type="button" class="chip" data-tower="${esc(k)}" aria-pressed="${gl.tower===k}">${esc(n)}</button>`).join('');
}
$('glchips').addEventListener('click',e=>{const b=e.target.closest('[data-tower]');if(!b)return;gl.tower=b.dataset.tower;flashTerm=null;renderChips();renderList();const nb=document.querySelector(`[data-tower="${CSS.escape(gl.tower)}"]`);if(nb)nb.focus()});
$('glaz').addEventListener('click',e=>{const b=e.target.closest('[data-letter]');if(!b)return;const el=$('gl-'+(b.dataset.letter==='#'?'num':b.dataset.letter));if(el)el.scrollIntoView({block:'start'})});
$('gq').addEventListener('input',e=>{gl.q=e.target.value;flashTerm=null;renderList()});
/* a link such as glossary.html?term=LC opens the page at that term (used by search results) */
const want=new URLSearchParams(location.search).get('term');
if(want){const hit=GLOSSARY.find(g=>g.term.toLowerCase()===want.toLowerCase());if(hit)flashTerm=hit.term}
renderChips();renderList();
if(flashTerm){const el=$('gt-'+slug(flashTerm));if(el){el.scrollIntoView({block:'center'});setTimeout(()=>el.classList.remove('flash'),2500)}}
$('faqBox').innerHTML=window.kmFaq?window.kmFaq('glossary'):'';
window.kmGuide&&window.kmGuide('glossary');
})();
</script>
</body>
</html>
